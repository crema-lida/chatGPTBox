name: Firefox preview package

on:
  push:
    branches:
      - build/firefox-test-package
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-firefox:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Check lint
        run: npm run lint
      - name: Check formatting
        run: npm run pretty:check
      - name: Build browser extensions
        run: npm run build
      - name: Verify Firefox bundle
        run: |
          test -s build/firefox.zip
          unzip -t build/firefox.zip
      - name: Upload Firefox bundle
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTBox-Firefox-token-parameter-preview
          path: build/firefox.zip
          if-no-files-found: error
          retention-days: 14
